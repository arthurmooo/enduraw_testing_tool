name: Build macOS installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: local_ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Confirm architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Build self-contained DMG
        shell: bash
        run: ./scripts/build_macos_installer.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: EndurawTestingTool-macOS-${{ matrix.architecture }}
          path: artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
